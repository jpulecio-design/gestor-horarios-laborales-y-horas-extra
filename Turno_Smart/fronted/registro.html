
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iniciar Sesión — Sistema de Horarios</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex;
           justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: #fff; padding: 2rem; border-radius: 8px; width: 300px;
                 box-shadow: 0 0 8px rgba(0,0,0,0.15); }
    .login-box h1 { font-size: 1.2rem; margin-bottom: 1rem; text-align: center; }
    .login-box label { display: block; margin-top: 0.8rem; font-size: 0.9rem; }
    .login-box input { width: 100%; padding: 0.5rem; margin-top: 0.3rem;
                        box-sizing: border-box; }
    .login-box button { width: 100%; margin-top: 1.2rem; padding: 0.6rem;
                         background: #2f5496; color: #fff; border: none;
                         border-radius: 4px; cursor: pointer; }
    .login-box button:hover { background: #24406f; }
    #mensajeError { color: #c0392b; font-size: 0.85rem; margin-top: 0.8rem;
                    text-align: center; min-height: 1em; }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>Sistema de Gestión de Horarios TurnoSmart</h1>

    <form id="loginForm">
      <label for="correo">Correo / usuario</label>
      <input type="text" id="correo" name="correo" required autocomplete="username" />

      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="contrasena" required autocomplete="current-password" />

      <button type="submit">Iniciar sesión</button>

      <div id="mensajeError"></div>
    </form>
  </div>

  <script src="../backend/registro.js"></script>
</body>
</html>

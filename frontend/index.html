<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend - Conexión Backend</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }

        .status-box {
            margin-bottom: 15px;
        }

        .connected {
            color: #4ec9b0;
        }

        .disconnected {
            color: #f44747;
        }

        .pending {
            color: #ce9178;
        }

        button {
            padding: 8px 16px;
            background: #0e639c;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #1177bb;
        }

        pre {
            background: #252526;
            padding: 15px;
            border-radius: 4px;
            overflow: auto;
            max-height: 400px;
        }
    </style>
</head>

<body>
    <h1>Estado de Conexión Backend</h1>

    <div class="status-box">
        <span>Estado: </span>
        <strong id="status" class="pending">Comprobando...</strong>
    </div>

    <button id="btn-test">Reintentar Conexión</button>

    <h3>Registro de Respuestas:</h3>
    <pre id="log"></pre>

    <script type="module" src="./src/main.js"></script>
</body>

</html>
